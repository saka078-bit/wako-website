<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#f97316">
<title>経費精算 | WAKO! 和光建設</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#38b6e8;
  --bg:#fef6f6;
  --bg2:#faeaea;
  --accent:#f97316;
  --accent-d:#e06510;
  --accent-l:#fff4ed;
  --text:#1e2d3d;
  --text-m:#7a8a9a;
  --border:#edd8d8;
  --white:#fff;
  --ok:#16a34a;
  --warn:#d97706;
  --ng:#dc2626;
  --ease:cubic-bezier(.16,1,.3,1);
  --head-h:56px;
  --tab-h:62px;
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);
  padding-top:var(--head-h);
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;line-height:1.7;
}
.num{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.01em}

/* ---------- header ---------- */
header{
  position:fixed;top:0;left:0;right:0;z-index:80;height:var(--head-h);
  display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;
  background:rgba(255,255,255,.97);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.h-brand{display:flex;align-items:center;gap:9px;min-width:0}
.h-brand img{height:30px;width:auto;display:block}
.h-title{font-size:.72rem;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.h-title span{display:block;font-size:.55rem;font-weight:500;color:var(--text-m);letter-spacing:.16em;text-transform:uppercase}
.role-switch{display:flex;background:var(--bg2);border-radius:999px;padding:2px;flex-shrink:0}
.role-switch button{
  border:0;background:none;font-family:inherit;font-size:.63rem;font-weight:700;color:var(--text-m);
  padding:6px 11px;border-radius:999px;cursor:pointer;transition:all .2s;white-space:nowrap
}
.role-switch button.on{background:var(--white);color:var(--accent);box-shadow:0 1px 5px rgba(0,0,0,.1)}

/* ---------- layout ---------- */
main{max-width:720px;margin:0 auto;padding:18px 14px 30px}
.view{display:none;animation:fade .3s var(--ease)}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec-title{
  font-size:.68rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--text-m);
  display:flex;align-items:center;gap:9px;margin:22px 0 10px
}
.sec-title::before{content:'';width:16px;height:2px;background:var(--accent);flex-shrink:0}
.sec-title:first-child{margin-top:0}
.card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}

/* ---------- form ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:.7rem;font-weight:600;color:var(--text-m);margin-bottom:5px;letter-spacing:.04em}
.field label .req{color:var(--accent);margin-left:3px}
input,select,textarea{
  width:100%;font-family:inherit;font-size:.92rem;color:var(--text);background:var(--white);
  border:1px solid var(--border);border-radius:7px;padding:11px 12px;transition:border-color .2s,box-shadow .2s
}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(249,115,22,.12)}
textarea{resize:vertical;min-height:64px;line-height:1.6}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%237a8a9a' stroke-width='1.6' fill='none'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:32px}
.amount-input{font-family:'Barlow Condensed',sans-serif;font-size:1.9rem;font-weight:700;text-align:right;padding:8px 12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--border);background:var(--white);border-radius:999px;padding:8px 14px;
  font-family:inherit;font-size:.78rem;font-weight:500;color:var(--text);cursor:pointer;transition:all .18s
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 12px rgba(249,115,22,.28)}
.hint{font-size:.68rem;color:var(--text-m);margin-top:5px;line-height:1.6}
.hint.warn{color:var(--warn);font-weight:600}

/* receipt */
.receipt-box{border:1.5px dashed var(--border);border-radius:9px;padding:18px;text-align:center;background:var(--bg2)}
.receipt-box label{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:.8rem;font-weight:600;color:var(--accent);margin:0}
.receipt-box input[type=file]{display:none}
.receipt-prev{position:relative;display:inline-block}
.receipt-prev img{max-width:100%;max-height:230px;border-radius:8px;display:block;border:1px solid var(--border)}
.receipt-del{
  position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;border:0;
  background:var(--ng);color:#fff;font-size:.85rem;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)
}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:inherit;
  font-size:.85rem;font-weight:600;letter-spacing:.04em;border:0;border-radius:5px;padding:13px 22px;
  cursor:pointer;transition:all .22s;text-decoration:none
}
.btn-main{background:var(--accent);color:#fff;box-shadow:0 4px 16px rgba(249,115,22,.3);width:100%}
.btn-main:hover{background:var(--accent-d);transform:translateY(-1px)}
.btn-sub{background:var(--white);color:var(--text);border:1px solid var(--border)}
.btn-sub:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:8px 14px;font-size:.72rem;border-radius:4px}
.btn-ok{background:var(--ok);color:#fff}
.btn-ng{background:var(--white);color:var(--ng);border:1px solid var(--ng)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- list ---------- */
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.filters select,.filters input{font-size:.76rem;padding:9px 10px}
.sum-bar{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--text);color:#fff;border-radius:9px;padding:12px 16px;margin-bottom:12px
}
.sum-bar .lbl{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.sum-bar .val{font-size:1.6rem}
.sum-bar .val small{font-size:.75rem;font-weight:500;margin-left:2px;opacity:.7}

.item{
  background:var(--white);border:1px solid var(--border);border-left:3px solid var(--border);
  border-radius:9px;padding:13px 15px;margin-bottom:9px;cursor:pointer;transition:all .2s
}
.item:hover{border-color:var(--accent);box-shadow:0 4px 18px rgba(0,0,0,.07)}
.item.st-submitted{border-left-color:var(--warn)}
.item.st-approved{border-left-color:var(--primary)}
.item.st-paid{border-left-color:var(--ok)}
.item.st-rejected{border-left-color:var(--ng)}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.item-date{font-size:.68rem;color:var(--text-m);letter-spacing:.06em}
.item-cat{font-size:.9rem;font-weight:700;margin-top:2px}
.item-amt{font-size:1.35rem;white-space:nowrap}
.item-amt small{font-size:.7rem;font-weight:500;margin-left:1px}
.item-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;align-items:center}
.tag{font-size:.65rem;background:var(--bg2);color:var(--text-m);padding:3px 9px;border-radius:999px;font-weight:500}
.tag.site{background:var(--accent-l);color:var(--accent-d)}
.badge{font-size:.63rem;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.05em}
.b-draft{background:#eef1f4;color:var(--text-m)}
.b-submitted{background:#fef3c7;color:#92400e}
.b-approved{background:#e0f2fe;color:#0369a1}
.b-paid{background:#dcfce7;color:#15803d}
.b-rejected{background:#fee2e2;color:#b91c1c}
.item-note{font-size:.72rem;color:var(--text-m);margin-top:7px;padding-top:7px;border-top:1px dashed var(--border)}
.has-receipt{font-size:.65rem;color:var(--primary);font-weight:600}
.empty{text-align:center;padding:46px 16px;color:var(--text-m);font-size:.82rem}
.empty div:first-child{font-size:2rem;margin-bottom:8px;opacity:.35}

/* ---------- report ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:14px}
.kpi .lbl{font-size:.63rem;color:var(--text-m);letter-spacing:.1em;font-weight:600}
.kpi .val{font-size:1.75rem;line-height:1.25;margin-top:3px}
.kpi .val small{font-size:.7rem;font-weight:500;margin-left:1px;color:var(--text-m)}
.kpi.hi{background:var(--text);border-color:var(--text)}
.kpi.hi .lbl{color:rgba(255,255,255,.5)}
.kpi.hi .val{color:#fff}
.kpi.hi .val small{color:rgba(255,255,255,.6)}
.bar-row{margin-bottom:11px}
.bar-head{display:flex;justify-content:space-between;font-size:.75rem;margin-bottom:4px}
.bar-head .n{font-weight:600}
.bar-head .v{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.95rem}
.bar-track{height:7px;background:var(--bg2);border-radius:999px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),#fbbf24);border-radius:999px;transition:width .6s var(--ease)}
.bar-fill.blue{background:linear-gradient(90deg,var(--primary),#7dd3fc)}

/* ---------- master ---------- */
.mlist{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.mrow{display:flex;align-items:center;gap:8px;background:var(--bg2);border-radius:6px;padding:8px 12px;font-size:.82rem}
.mrow span{flex:1}
.mrow button{border:0;background:none;color:var(--ng);cursor:pointer;font-size:.72rem;font-family:inherit;padding:2px 4px}
.add-row{display:flex;gap:8px}
.add-row input{flex:1}

/* ---------- tabs ---------- */
.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:80;height:calc(var(--tab-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(255,255,255,.98);backdrop-filter:blur(20px);border-top:1px solid var(--border)
}
.tab{
  border:0;background:none;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;color:var(--text-m);transition:color .2s;position:relative
}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab .lb{font-size:.62rem;font-weight:600;letter-spacing:.05em}
.tab.on{color:var(--accent)}
.tab.on::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:2px;background:var(--accent);border-radius:0 0 2px 2px}
.tab .dot{position:absolute;top:9px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--accent);color:#fff;font-size:.58rem;font-weight:700;display:none;align-items:center;justify-content:center}
.tab .dot.show{display:flex}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal-bg{position:absolute;inset:0;background:rgba(14,22,32,.55);backdrop-filter:blur(3px)}
.modal-body{
  position:relative;background:var(--bg);width:100%;max-width:720px;max-height:88vh;overflow-y:auto;
  border-radius:16px 16px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));
  animation:up .3s var(--ease)
}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-head h3{font-size:1rem}
.modal-close{border:0;background:var(--bg2);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1rem;color:var(--text-m)}
.dl{display:grid;grid-template-columns:88px 1fr;gap:9px 12px;font-size:.84rem}
.dl dt{color:var(--text-m);font-size:.72rem;font-weight:600;padding-top:2px}
.dl dd img{max-width:100%;border-radius:8px;border:1px solid var(--border)}

.toast{
  position:fixed;left:50%;bottom:calc(var(--tab-h) + 22px);transform:translate(-50%,14px);z-index:300;
  background:var(--text);color:#fff;font-size:.8rem;font-weight:500;padding:12px 22px;border-radius:999px;
  box-shadow:0 8px 30px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:all .3s var(--ease);white-space:nowrap
}
.toast.on{opacity:1;transform:translate(-50%,0)}

.notice{background:var(--accent-l);border:1px solid #fcd9b6;border-radius:8px;padding:11px 13px;font-size:.72rem;color:var(--accent-d);line-height:1.7;margin-bottom:12px}
.danger-zone{border-color:#f5c2c2}
@media(min-width:640px){
  .filters{grid-template-columns:repeat(4,1fr)}
  .kpis{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>

<header>
  <div class="h-brand">
    <img src="../images/wako_logo.png" alt="WAKO!" onerror="this.style.display='none'">
    <div class="h-title">経費精算<span>Expense</span></div>
  </div>
  <div class="role-switch">
    <button id="roleStaff" class="on" onclick="setRole('staff')">申請する人</button>
    <button id="roleAdmin" onclick="setRole('admin')">承認する人</button>
  </div>
</header>

<main>
  <!-- ========== 入力 ========== -->
  <section id="v-entry" class="view on">
    <div class="notice">現場で撮って、その場で申請。金額と写真だけでも下書き保存できます。</div>
    <div class="card">
      <div class="field">
        <label>金額（税込）<span class="req">*</span></label>
        <input id="f-amount" class="amount-input" type="number" inputmode="numeric" placeholder="0" min="0" step="1">
      </div>
      <div class="field">
        <label>費目<span class="req">*</span></label>
        <div id="f-cats" class="chips"></div>
      </div>
      <div class="row2">
        <div class="field">
          <label>日付<span class="req">*</span></label>
          <input id="f-date" type="date">
        </div>
        <div class="field">
          <label>支払方法</label>
          <select id="f-pay">
            <option value="cash">現金立替</option>
            <option value="private-card">個人カード立替</option>
            <option value="corp-card">社用カード</option>
            <option value="etc">ETCカード</option>
          </select>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>申請者<span class="req">*</span></label>
          <select id="f-user"></select>
        </div>
        <div class="field">
          <label>現場・案件</label>
          <select id="f-site"></select>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>支払先</label>
          <input id="f-vendor" type="text" placeholder="○○ホームセンター">
        </div>
        <div class="field">
          <label>税区分</label>
          <select id="f-tax">
            <option value="10">10%</option>
            <option value="8">8%（軽減）</option>
            <option value="0">対象外・非課税</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>備考</label>
        <textarea id="f-memo" placeholder="例：3現場分の資材まとめ買い／同行者2名"></textarea>
      </div>
      <div class="field">
        <label>領収書</label>
        <div id="f-receipt-box" class="receipt-box">
          <label for="f-receipt">📷 撮影・画像を選ぶ</label>
          <input id="f-receipt" type="file" accept="image/*" capture="environment">
          <div class="hint">スマホなら撮影、PCなら画像選択。自動で縮小して保存します。</div>
        </div>
        <div id="f-receipt-warn" class="hint warn" style="display:none">1万円以上は領収書の添付をおすすめします。</div>
      </div>
      <div class="btn-row">
        <button class="btn btn-main" onclick="save('submitted')">この内容で申請する</button>
      </div>
      <div class="btn-row" style="margin-top:8px">
        <button class="btn btn-sub btn-sm" style="flex:1" onclick="save('draft')">下書き保存</button>
        <button class="btn btn-sub btn-sm" style="flex:1" onclick="resetForm()">クリア</button>
      </div>
    </div>
  </section>

  <!-- ========== 一覧 ========== -->
  <section id="v-list" class="view">
    <div class="filters">
      <input id="q-month" type="month">
      <select id="q-status">
        <option value="">全ステータス</option>
        <option value="draft">下書き</option>
        <option value="submitted">申請中</option>
        <option value="approved">承認済</option>
        <option value="paid">精算済</option>
        <option value="rejected">差戻し</option>
      </select>
      <select id="q-user"></select>
      <select id="q-site"></select>
    </div>
    <div class="sum-bar">
      <div>
        <div class="lbl">Filtered total</div>
        <div id="sum-count" style="font-size:.68rem;color:rgba(255,255,255,.6)">0件</div>
      </div>
      <div class="val num">¥<span id="sum-amount">0</span></div>
    </div>
    <div class="btn-row" style="margin-bottom:12px">
      <button class="btn btn-sub btn-sm" onclick="exportCsv()">CSV書き出し</button>
      <button class="btn btn-sub btn-sm" onclick="bulkPaid()" id="btn-bulk">承認済をまとめて精算済に</button>
    </div>
    <div id="list"></div>
  </section>

  <!-- ========== 集計 ========== -->
  <section id="v-report" class="view">
    <div class="field" style="margin-bottom:14px">
      <label>対象月</label>
      <input id="r-month" type="month">
    </div>
    <div class="kpis">
      <div class="kpi hi"><div class="lbl">未精算（立替残）</div><div class="val num">¥<span id="k-unpaid">0</span></div></div>
      <div class="kpi"><div class="lbl">当月合計</div><div class="val num">¥<span id="k-total">0</span></div></div>
      <div class="kpi"><div class="lbl">承認待ち</div><div class="val num"><span id="k-wait">0</span><small>件</small></div></div>
      <div class="kpi"><div class="lbl">消費税（当月）</div><div class="val num">¥<span id="k-tax">0</span></div></div>
    </div>
    <div class="sec-title">費目別</div>
    <div class="card" id="r-cat"></div>
    <div class="sec-title">現場別</div>
    <div class="card" id="r-site"></div>
    <div class="sec-title">申請者別</div>
    <div class="card" id="r-user"></div>
  </section>

  <!-- ========== 設定 ========== -->
  <section id="v-setting" class="view">
    <div class="notice">現在のデータはこの端末のブラウザ内（localStorage）にのみ保存されます。共有・バックアップは本番版で対応予定です。</div>
    <div class="sec-title">社員</div>
    <div class="card">
      <div id="m-users" class="mlist"></div>
      <div class="add-row"><input id="add-user" placeholder="氏名を入力"><button class="btn btn-sub btn-sm" onclick="addMaster('users')">追加</button></div>
    </div>
    <div class="sec-title">現場・案件</div>
    <div class="card">
      <div id="m-sites" class="mlist"></div>
      <div class="add-row"><input id="add-site" placeholder="例：神戸市中央区 ○○ビル 内装解体"><button class="btn btn-sub btn-sm" onclick="addMaster('sites')">追加</button></div>
    </div>
    <div class="sec-title">費目</div>
    <div class="card">
      <div id="m-cats" class="mlist"></div>
      <div class="add-row"><input id="add-cat" placeholder="例：高速・ETC"><button class="btn btn-sub btn-sm" onclick="addMaster('cats')">追加</button></div>
    </div>
    <div class="sec-title">データ</div>
    <div class="card danger-zone">
      <div class="btn-row">
        <button class="btn btn-sub btn-sm" onclick="exportJson()">バックアップ書き出し</button>
        <label class="btn btn-sub btn-sm" style="cursor:pointer">読み込み<input type="file" accept="application/json" style="display:none" onchange="importJson(this)"></label>
        <button class="btn btn-sub btn-sm" onclick="seedDemo()">サンプル投入</button>
        <button class="btn btn-ng btn-sm" onclick="wipe()">全消去</button>
      </div>
      <div class="hint" id="storage-info" style="margin-top:10px"></div>
    </div>
  </section>
</main>

<div class="modal" id="modal">
  <div class="modal-bg" onclick="closeModal()"></div>
  <div class="modal-body">
    <div class="modal-head">
      <h3>申請の詳細</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   WAKO 経費精算 — プロトタイプ v0.1
   データは localStorage に保存（端末内のみ）
   ========================================================= */
const KEY = 'wako_keihi_v1';
const STATUS = {
  draft:    {label:'下書き',  cls:'b-draft'},
  submitted:{label:'申請中',  cls:'b-submitted'},
  approved: {label:'承認済',  cls:'b-approved'},
  paid:     {label:'精算済',  cls:'b-paid'},
  rejected: {label:'差戻し',  cls:'b-rejected'}
};
const PAY = {
  'cash':'現金立替','private-card':'個人カード立替','corp-card':'社用カード','etc':'ETCカード'
};
const DEFAULTS = {
  users:['山田 太郎','佐藤 健','鈴木 一郎'],
  sites:['神戸市中央区 ○○ビル 内装解体','大阪市北区 テナントスケルトン','京都市下京区 木造解体'],
  cats :['交通費','高速・ETC','駐車場','燃料費','資材・工具','消耗品','産廃処分費','接待交際費','その他']
};

let db = load();
let role = localStorage.getItem(KEY+'_role') || 'staff';
let form = {cat:null, receipt:null, editId:null};

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return Object.assign({items:[]}, DEFAULTS, JSON.parse(raw));
  }catch(e){ console.warn(e); }
  return Object.assign({items:[]}, {users:[...DEFAULTS.users], sites:[...DEFAULTS.sites], cats:[...DEFAULTS.cats]});
}
function save_db(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ toast('保存容量が上限です。古い領収書画像を削除してください'); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const yen = n => (n||0).toLocaleString('ja-JP');
const ym  = d => (d||'').slice(0,7);
const todayStr = () => new Date().toLocaleDateString('sv-SE');
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove('on'), 2200);
}

/* ---------- 税計算：金額は税込入力 ---------- */
function taxOf(item){
  const r = Number(item.tax||0);
  if(!r) return 0;
  return Math.round(item.amount - item.amount / (1 + r/100));
}

/* ---------- 画面切替 ---------- */
function go(v){
  document.querySelectorAll('.view').forEach(s=>s.classList.remove('on'));
  document.getElementById('v-'+v).classList.add('on');
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.v===v));
  if(v==='list') renderList();
  if(v==='report') renderReport();
  if(v==='setting') renderMasters();
  window.scrollTo({top:0});
}
function setRole(r){
  role = r; localStorage.setItem(KEY+'_role', r);
  document.getElementById('roleStaff').classList.toggle('on', r==='staff');
  document.getElementById('roleAdmin').classList.toggle('on', r==='admin');
  document.getElementById('btn-bulk').style.display = r==='admin' ? '' : 'none';
  renderList(); renderBadge();
}

/* ---------- マスタ → セレクト ---------- */
function fillSelect(el, arr, allLabel){
  const cur = el.value;
  el.innerHTML = (allLabel ? `<option value="">${allLabel}</option>` : '')
    + arr.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');
  if([...el.options].some(o=>o.value===cur)) el.value = cur;
}
function renderSelects(){
  fillSelect(document.getElementById('f-user'), db.users);
  fillSelect(document.getElementById('f-site'), db.sites, '（現場なし・共通）');
  fillSelect(document.getElementById('q-user'), db.users, '全社員');
  fillSelect(document.getElementById('q-site'), db.sites, '全現場');
  const box = document.getElementById('f-cats');
  box.innerHTML = db.cats.map(c=>
    `<button type="button" class="chip${form.cat===c?' on':''}" onclick="pickCat('${esc(c).replace(/'/g,"\\'")}')">${esc(c)}</button>`
  ).join('');
}
function pickCat(c){ form.cat = c; renderSelects(); }

/* ---------- 領収書（縮小して保存） ---------- */
function compressImage(file, cb){
  const img = new Image();
  img.onload = ()=>{
    const max = 1000, sc = Math.min(1, max/Math.max(img.width, img.height));
    const cv = document.createElement('canvas');
    cv.width  = Math.round(img.width  * sc);
    cv.height = Math.round(img.height * sc);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(img.src);
    cb(cv.toDataURL('image/jpeg', 0.7));
  };
  img.src = URL.createObjectURL(file);
}
function renderReceiptBox(){
  const box = document.getElementById('f-receipt-box');
  if(form.receipt){
    box.innerHTML = `<div class="receipt-prev"><img src="${form.receipt}" alt="領収書">
      <button class="receipt-del" onclick="delReceipt()">✕</button></div>`;
    return;
  }
  box.innerHTML = `<label for="f-receipt">📷 撮影・画像を選ぶ</label>
    <input id="f-receipt" type="file" accept="image/*" capture="environment">
    <div class="hint">スマホなら撮影、PCなら画像選択。自動で縮小して保存します。</div>`;
  document.getElementById('f-receipt').onchange = function(){
    const file = this.files[0]; if(!file) return;
    compressImage(file, data => {
      form.receipt = data;
      document.getElementById('f-receipt-warn').style.display = 'none';
      renderReceiptBox();
    });
  };
}
function delReceipt(){ form.receipt = null; renderReceiptBox(); }

document.getElementById('f-amount').addEventListener('input', function(){
  document.getElementById('f-receipt-warn').style.display =
    (Number(this.value) >= 10000 && !form.receipt) ? '' : 'none';
});

/* ---------- 保存 ---------- */
function save(status){
  const amount = Number(document.getElementById('f-amount').value);
  const date   = document.getElementById('f-date').value;
  if(!amount || amount<=0) return toast('金額を入力してください');
  if(!form.cat)            return toast('費目を選んでください');
  if(!date)                return toast('日付を選んでください');

  const item = {
    id: form.editId || uid(),
    date,
    user  : document.getElementById('f-user').value,
    site  : document.getElementById('f-site').value,
    cat   : form.cat,
    amount,
    tax   : Number(document.getElementById('f-tax').value),
    pay   : document.getElementById('f-pay').value,
    vendor: document.getElementById('f-vendor').value.trim(),
    memo  : document.getElementById('f-memo').value.trim(),
    receipt: form.receipt,
    status,
    reason: '',
    updatedAt: Date.now()
  };
  if(form.editId){
    const i = db.items.findIndex(x=>x.id===form.editId);
    item.createdAt = db.items[i].createdAt;
    db.items[i] = item;
  }else{
    item.createdAt = Date.now();
    db.items.unshift(item);
  }
  save_db(); resetForm(); renderBadge();
  toast(status==='draft' ? '下書きを保存しました' : '申請しました');
  go('list');
}
function resetForm(){
  form = {cat:null, receipt:null, editId:null};
  document.getElementById('f-amount').value = '';
  document.getElementById('f-vendor').value = '';
  document.getElementById('f-memo').value = '';
  document.getElementById('f-date').value = todayStr();
  document.getElementById('f-tax').value = '10';
  document.getElementById('f-pay').value = 'cash';
  document.getElementById('f-receipt-warn').style.display = 'none';
  renderSelects(); renderReceiptBox();
}
function editItem(id){
  const it = db.items.find(x=>x.id===id); if(!it) return;
  form = {cat:it.cat, receipt:it.receipt, editId:it.id};
  document.getElementById('f-amount').value = it.amount;
  document.getElementById('f-date').value   = it.date;
  document.getElementById('f-user').value   = it.user;
  document.getElementById('f-site').value   = it.site;
  document.getElementById('f-tax').value    = it.tax;
  document.getElementById('f-pay').value    = it.pay;
  document.getElementById('f-vendor').value = it.vendor;
  document.getElementById('f-memo').value   = it.memo;
  renderSelects(); renderReceiptBox(); closeModal(); go('entry');
  toast('編集モード：保存すると上書きされます');
}

/* ---------- 一覧 ---------- */
function filtered(){
  const m = document.getElementById('q-month').value;
  const s = document.getElementById('q-status').value;
  const u = document.getElementById('q-user').value;
  const g = document.getElementById('q-site').value;
  return db.items
    .filter(i => (!m || ym(i.date)===m) && (!s || i.status===s) && (!u || i.user===u) && (!g || i.site===g))
    .sort((a,b)=> b.date.localeCompare(a.date) || b.createdAt-a.createdAt);
}
function renderList(){
  const rows = filtered();
  const total = rows.reduce((s,i)=>s+i.amount,0);
  document.getElementById('sum-amount').textContent = yen(total);
  document.getElementById('sum-count').textContent  = rows.length + '件';
  const el = document.getElementById('list');
  if(!rows.length){
    el.innerHTML = `<div class="empty"><div>🧾</div><div>該当する申請がありません</div></div>`;
    return;
  }
  el.innerHTML = rows.map(i=>{
    const st = STATUS[i.status];
    return `<div class="item st-${i.status}" onclick="openItem('${i.id}')">
      <div class="item-top">
        <div>
          <div class="item-date">${esc(i.date)}</div>
          <div class="item-cat">${esc(i.cat)}${i.vendor?` <span style="font-weight:400;font-size:.75rem;color:var(--text-m)">/ ${esc(i.vendor)}</span>`:''}</div>
        </div>
        <div class="item-amt num">¥${yen(i.amount)}</div>
      </div>
      <div class="item-meta">
        <span class="badge ${st.cls}">${st.label}</span>
        <span class="tag">${esc(i.user)}</span>
        ${i.site?`<span class="tag site">${esc(i.site)}</span>`:''}
        <span class="tag">${PAY[i.pay]||i.pay}</span>
        ${i.receipt?'<span class="has-receipt">📎 領収書あり</span>':''}
      </div>
      ${i.memo?`<div class="item-note">${esc(i.memo)}</div>`:''}
      ${i.status==='rejected'&&i.reason?`<div class="item-note" style="color:var(--ng)">差戻し理由：${esc(i.reason)}</div>`:''}
    </div>`;
  }).join('');
}
['q-month','q-status','q-user','q-site'].forEach(id=>
  document.getElementById(id).addEventListener('change', renderList));

/* ---------- 詳細モーダル ---------- */
function openItem(id){
  const i = db.items.find(x=>x.id===id); if(!i) return;
  const st = STATUS[i.status];
  const tax = taxOf(i);
  let actions = '';
  if(role==='admin' && i.status==='submitted'){
    actions = `<div class="btn-row" style="margin-top:16px">
      <button class="btn btn-ok btn-sm" style="flex:1" onclick="setStatus('${i.id}','approved')">承認する</button>
      <button class="btn btn-ng btn-sm" style="flex:1" onclick="reject('${i.id}')">差し戻す</button></div>`;
  }else if(role==='admin' && i.status==='approved'){
    actions = `<div class="btn-row" style="margin-top:16px">
      <button class="btn btn-ok btn-sm" style="flex:1" onclick="setStatus('${i.id}','paid')">精算済にする</button></div>`;
  }else if(i.status==='draft' || i.status==='rejected'){
    actions = `<div class="btn-row" style="margin-top:16px">
      <button class="btn btn-main btn-sm" style="flex:1" onclick="setStatus('${i.id}','submitted')">申請する</button></div>`;
  }
  document.getElementById('modal-content').innerHTML = `
    <dl class="dl">
      <dt>ステータス</dt><dd><span class="badge ${st.cls}">${st.label}</span></dd>
      <dt>日付</dt><dd>${esc(i.date)}</dd>
      <dt>金額</dt><dd class="num" style="font-size:1.4rem">¥${yen(i.amount)}
        <span style="font-size:.7rem;font-weight:500;color:var(--text-m)">（税${i.tax}% / 内消費税 ¥${yen(tax)}）</span></dd>
      <dt>費目</dt><dd>${esc(i.cat)}</dd>
      <dt>申請者</dt><dd>${esc(i.user)}</dd>
      <dt>現場</dt><dd>${esc(i.site)||'—'}</dd>
      <dt>支払方法</dt><dd>${PAY[i.pay]||i.pay}</dd>
      <dt>支払先</dt><dd>${esc(i.vendor)||'—'}</dd>
      <dt>備考</dt><dd>${esc(i.memo)||'—'}</dd>
      ${i.reason?`<dt>差戻し理由</dt><dd style="color:var(--ng)">${esc(i.reason)}</dd>`:''}
      <dt>領収書</dt><dd>${i.receipt?`<img src="${i.receipt}" alt="領収書">`:'—'}</dd>
    </dl>
    ${actions}
    <div class="btn-row" style="margin-top:8px">
      <button class="btn btn-sub btn-sm" style="flex:1" onclick="editItem('${i.id}')">編集</button>
      <button class="btn btn-sub btn-sm" style="flex:1;color:var(--ng)" onclick="delItem('${i.id}')">削除</button>
    </div>`;
  document.getElementById('modal').classList.add('on');
}
function closeModal(){ document.getElementById('modal').classList.remove('on'); }
function setStatus(id, s){
  const i = db.items.find(x=>x.id===id); if(!i) return;
  i.status = s; if(s!=='rejected') i.reason=''; i.updatedAt = Date.now();
  save_db(); closeModal(); renderList(); renderBadge();
  toast(STATUS[s].label + 'にしました');
}
function reject(id){
  const r = prompt('差戻し理由を入力してください（申請者に表示されます）');
  if(r===null) return;
  const i = db.items.find(x=>x.id===id);
  i.status='rejected'; i.reason=r; i.updatedAt=Date.now();
  save_db(); closeModal(); renderList(); renderBadge(); toast('差し戻しました');
}
function delItem(id){
  if(!confirm('この申請を削除します。よろしいですか？')) return;
  db.items = db.items.filter(x=>x.id!==id);
  save_db(); closeModal(); renderList(); renderBadge(); toast('削除しました');
}
function bulkPaid(){
  const rows = filtered().filter(i=>i.status==='approved');
  if(!rows.length) return toast('承認済の申請がありません');
  if(!confirm(`${rows.length}件（¥${yen(rows.reduce((s,i)=>s+i.amount,0))}）を精算済にします。`)) return;
  rows.forEach(i=>{ i.status='paid'; i.updatedAt=Date.now(); });
  save_db(); renderList(); renderBadge(); toast('精算済にしました');
}
function renderBadge(){
  const n = db.items.filter(i=> role==='admin' ? i.status==='submitted' : (i.status==='draft'||i.status==='rejected')).length;
  const dot = document.getElementById('tab-dot');
  dot.textContent = n; dot.classList.toggle('show', n>0);
}

/* ---------- 集計 ---------- */
function groupBars(rows, key, el, blue){
  const map = {};
  rows.forEach(i=> map[i[key] || '（未設定）'] = (map[i[key]||'（未設定）']||0) + i.amount);
  const arr = Object.entries(map).sort((a,b)=>b[1]-a[1]);
  if(!arr.length){ el.innerHTML = `<div class="empty" style="padding:18px"><div style="font-size:1rem">データなし</div></div>`; return; }
  const max = arr[0][1];
  el.innerHTML = arr.map(([n,v])=>`
    <div class="bar-row">
      <div class="bar-head"><span class="n">${esc(n)}</span><span class="v">¥${yen(v)}</span></div>
      <div class="bar-track"><div class="bar-fill${blue?' blue':''}" style="width:${Math.max(3,v/max*100)}%"></div></div>
    </div>`).join('');
}
function renderReport(){
  const m = document.getElementById('r-month').value;
  const rows = db.items.filter(i=> (!m || ym(i.date)===m) && i.status!=='draft' && i.status!=='rejected');
  document.getElementById('k-total').textContent = yen(rows.reduce((s,i)=>s+i.amount,0));
  document.getElementById('k-tax').textContent   = yen(rows.reduce((s,i)=>s+taxOf(i),0));
  document.getElementById('k-wait').textContent  = db.items.filter(i=>i.status==='submitted').length;
  // 未精算＝申請中＋承認済のうち立替（社用カード以外）
  const unpaid = db.items
    .filter(i=>(i.status==='submitted'||i.status==='approved') && i.pay!=='corp-card' && i.pay!=='etc')
    .reduce((s,i)=>s+i.amount,0);
  document.getElementById('k-unpaid').textContent = yen(unpaid);
  groupBars(rows,'cat', document.getElementById('r-cat'));
  groupBars(rows,'site',document.getElementById('r-site'), true);
  groupBars(rows,'user',document.getElementById('r-user'));
}
document.getElementById('r-month').addEventListener('change', renderReport);

/* ---------- CSV ---------- */
function exportCsv(){
  const rows = filtered();
  if(!rows.length) return toast('書き出すデータがありません');
  const head = ['日付','申請者','現場・案件','費目','支払方法','支払先','金額(税込)','税区分','税抜','消費税','ステータス','備考','領収書'];
  const body = rows.map(i=>{
    const tax = taxOf(i);
    return [i.date, i.user, i.site, i.cat, PAY[i.pay]||i.pay, i.vendor,
            i.amount, i.tax?i.tax+'%':'対象外', i.amount-tax, tax,
            STATUS[i.status].label, i.memo, i.receipt?'あり':'なし'];
  });
  const csv = [head, ...body]
    .map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  download('\uFEFF'+csv, `keihi_${todayStr()}.csv`, 'text/csv;charset=utf-8');
  toast('CSVを書き出しました');
}
function exportJson(){
  download(JSON.stringify(db,null,2), `keihi_backup_${todayStr()}.json`, 'application/json');
  toast('バックアップを書き出しました');
}
function importJson(inp){
  const f = inp.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const d = JSON.parse(rd.result);
      if(!Array.isArray(d.items)) throw new Error('形式が違います');
      db = Object.assign({users:[],sites:[],cats:[],items:[]}, d);
      save_db(); renderSelects(); renderList(); renderMasters(); renderBadge();
      toast('読み込みました');
    }catch(e){ toast('読み込みに失敗しました'); }
  };
  rd.readAsText(f); inp.value='';
}
function download(text, name, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

/* ---------- マスタ ---------- */
function renderMasters(){
  const map = {users:'m-users', sites:'m-sites', cats:'m-cats'};
  for(const k in map){
    document.getElementById(map[k]).innerHTML = db[k].map((v,idx)=>
      `<div class="mrow"><span>${esc(v)}</span><button onclick="delMaster('${k}',${idx})">削除</button></div>`
    ).join('') || `<div class="hint">未登録です</div>`;
  }
  const bytes = new Blob([localStorage.getItem(KEY)||'']).size;
  document.getElementById('storage-info').textContent =
    `保存件数 ${db.items.length}件／使用容量 約${(bytes/1024).toFixed(0)}KB（目安上限 5,000KB）`;
}
function addMaster(k){
  const id = {users:'add-user', sites:'add-site', cats:'add-cat'}[k];
  const inp = document.getElementById(id);
  const v = inp.value.trim(); if(!v) return;
  if(db[k].includes(v)) return toast('すでに登録されています');
  db[k].push(v); inp.value=''; save_db(); renderMasters(); renderSelects();
}
function delMaster(k, idx){
  db[k].splice(idx,1); save_db(); renderMasters(); renderSelects();
}
function wipe(){
  if(!confirm('すべての申請とマスタを削除します。元に戻せません。')) return;
  localStorage.removeItem(KEY);
  db = load(); form={cat:null,receipt:null,editId:null};
  renderSelects(); renderReceiptBox(); renderList(); renderMasters(); renderBadge();
  toast('全消去しました');
}
function seedDemo(){
  const d = new Date();
